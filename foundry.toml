[profile.default]
via_ir = true
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "worker/node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 100
bracket_spacing = true
